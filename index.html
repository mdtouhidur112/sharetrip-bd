<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShareTrip BD — Luxury &amp; Curated World Voyages</title>

    <!-- Brand Favicons & App Icons (STB Logo) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="shortcut icon" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#020617" />

    <!-- Primary SEO Meta Tags -->
    <meta name="description" content="Book curated tour packages, luxury hotels, transport &amp; dining experiences across Bangladesh and worldwide with ShareTrip BD (STB)." />
    <meta name="keywords" content="ShareTrip BD, STB, travel agency bangladesh, tour packages, luxury hotels, flight &amp; transport booking, curated voyages" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="ShareTrip BD" />

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ShareTrip BD" />
    <meta property="og:title" content="ShareTrip BD — Luxury &amp; Curated World Voyages" />
    <meta property="og:description" content="Book curated tour packages, luxury hotels, transport &amp; dining experiences across Bangladesh and worldwide." />
    <meta property="og:image" content="/stb-logo.png" />
    <meta property="og:image:alt" content="STB — ShareTrip BD Official Logo" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShareTrip BD — Luxury &amp; Curated World Voyages" />
    <meta name="twitter:description" content="Book curated tour packages, luxury hotels, transport &amp; dining experiences across Bangladesh and worldwide." />
    <meta name="twitter:image" content="/stb-logo.png" />
    <meta name="twitter:image:alt" content="STB — ShareTrip BD Official Logo" />

    <!-- Structured Data (Google Search Logo & TravelAgency Schema) -->
    <script type="application/ld+json" id="static-jsonld-seo">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "ShareTrip BD",
        "alternateName": "STB",
        "description": "Book curated tour packages, luxury hotels, transport & dining experiences across Bangladesh and worldwide.",
        "logo": "/icon-512x512.png",
        "image": "/stb-logo.png"
      }
    </script>
    <!-- Google Fonts: Plus Jakarta Sans for crisp, modern VisionOS typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#E2E8F0] dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-[#69EBDA]/30 selection:text-slate-900 min-h-screen overflow-x-hidden font-['Plus_Jakarta_Sans','Hind_Siliguri',sans-serif] transition-colors duration-300">
    <div id="root"></div>
    <!-- Hidden Google Translate Element for automated bilingual translation -->
    <div id="google_translate_element" style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;"></div>
    <script type="text/javascript">
      // Set default language cookie to English if user hasn't explicitly set another language
      try {
        var savedLang = localStorage.getItem('aetheria_language');
        if (!savedLang) {
          localStorage.setItem('aetheria_language', 'en');
          savedLang = 'en';
        }
        if (savedLang === 'en') {
          document.cookie = 'googtrans=/bn/en; path=/;';
        } else {
          document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        }
      } catch (e) {}

      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'bn',
            includedLanguages: 'en,bn',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
